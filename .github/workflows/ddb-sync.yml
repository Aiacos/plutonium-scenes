name: Build DDB scene data

# Rebuilds the `generated` branch daily: the latest TheGiddyLimit/plutonium-scenes data, enriched
# with the DDB Importer community lights, walls and creature placements (MrPrimate/ddb-meta-data).
# Point Plutonium's "Base Scene Repository URL" at
#   https://raw.githubusercontent.com/Aiacos/plutonium-scenes/generated
#
# `generated` is an orphan branch holding only `data/` (all Plutonium reads). Upstream is merged
# locally and never pushed: a GITHUB_TOKEN cannot push commits that touch upstream's workflow files.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ddb_ref:
        description: "ddb-meta-data commit/branch to build from (empty: latest main)"
        required: false
        default: ""
      vet_ref:
        description: "5etools-src commit/branch to build from (empty: latest main)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths: [ "_node/ddb-import/**", ".github/workflows/ddb-sync.yml" ]

permissions:
  contents: write

concurrency:
  group: ddb-sync
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Aiacos/plutonium-scenes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the latest upstream data (local only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TheGiddyLimit/plutonium-scenes.git
          git fetch upstream main
          # Our commits never touch upstream files, so this merge cannot conflict
          git merge --no-edit upstream/main

      # Each build records the input commits in the `generated` commit message; to roll back a bad
      # upstream push, re-run this workflow with those commits as `ddb_ref` / `vet_ref`.
      - name: Fetch DDB meta data and 5etools data
        env:
          DDB_REF: ${{ inputs.ddb_ref }}
          VET_REF: ${{ inputs.vet_ref }}
        run: |
          fetch () { # <repo url> <dir> <ref or empty> [fetch options]
            git init -q "$2" && git -C "$2" remote add origin "$1"
            git -C "$2" fetch -q --depth 1 $4 origin "${3:-HEAD}"
          }
          fetch https://github.com/MrPrimate/ddb-meta-data.git "$RUNNER_TEMP/ddb-meta-data" "$DDB_REF"
          git -C "$RUNNER_TEMP/ddb-meta-data" checkout -q FETCH_HEAD
          fetch https://github.com/5etools-mirror-3/5etools-src.git "$RUNNER_TEMP/5etools-src" "$VET_REF" --filter=blob:none
          git -C "$RUNNER_TEMP/5etools-src" sparse-checkout set --no-cone \
            '/data/adventure/' '/data/book/' '/data/bestiary/' '/data/adventures.json' '/data/books.json'
          git -C "$RUNNER_TEMP/5etools-src" checkout -q FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      # Our generator only: upstream's own files have lint errors we do not touch
      - name: Lint and unit-test the generator
        run: |
          npx eslint _node/ddb-import
          node --test _node/ddb-import/test/

      - name: Build enriched scene data
        run: |
          node _node/ddb-import/build.js \
            --ddb "$RUNNER_TEMP/ddb-meta-data/content" \
            --vet "$RUNNER_TEMP/5etools-src/data" \
            --report "$RUNNER_TEMP/ddb-import-report.json"

      - name: Validate
        run: npm run test:data

      - name: Publish the generated branch
        run: |
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          DDB_SHA=$(git -C "$RUNNER_TEMP/ddb-meta-data" rev-parse HEAD)
          VET_SHA=$(git -C "$RUNNER_TEMP/5etools-src" rev-parse HEAD)
          OUT="$RUNNER_TEMP/out"
          git worktree add --orphan -b generated-new "$OUT"
          cp -r data "$OUT/data"
          cp "$RUNNER_TEMP/ddb-import-report.json" "$OUT/ddb-import-report.json"
          printf '# Generated Plutonium scene data\n\nBuilt by `.github/workflows/ddb-sync.yml` on `main`. Do not edit.\n' > "$OUT/README.md"
          cd "$OUT"
          git add -A
          git commit -q -m "build: DDB community scene data ($(date -u +%F))" \
            -m "plutonium-scenes ${UPSTREAM_SHA}" -m "ddb_ref=${DDB_SHA}" -m "vet_ref=${VET_SHA}"
          git push --force origin generated-new:generated
